name: Build Portable Windows (Testing Only)

on:
  push:
    branches: [master]
    paths:
      - 'src/**'
      - 'src-tauri/**'
      - 'package.json'
      - 'index.html'
      - 'viewer.html'
      - 'vite.config.js'
      - '.github/workflows/build-portable.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable:
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build portable EXE
        run: npm run tauri build -- --no-bundle --config src-tauri/tauri.portable.conf.json

      - name: Package portable folder
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Get-ChildItem 'src-tauri/target/release' -Filter '*.exe' -File | Select-Object -First 1
          if (-not $exe) { throw 'Windows executable was not produced.' }
          $root = 'portable/Mini Notes'
          New-Item -ItemType Directory -Force "$root/data/notes", "$root/data/images" | Out-Null
          Copy-Item -LiteralPath $exe.FullName -Destination "$root/Mini Notes.exe"
          Set-Content -LiteralPath "$root/data/notes/.keep" -Value 'notes saved here' -Encoding UTF8
          Set-Content -LiteralPath "$root/data/images/.keep" -Value 'images saved here' -Encoding UTF8
          @'
          Mini Notes — UNRELEASED TESTING BUILD (recovered note support)

          Extract the whole Mini Notes folder to a writable location (Desktop, Documents).
          Double-click Mini Notes.exe. No installation or npm needed.

          All your notes and pictures are in data/. Back up or transfer the entire folder.
          This build fixes legacy .json.tmp recovery and Tauri rename() paths.
          Never overwrite your previous data/ while testing.
          A WebView2 runtime is required and is usually already present on Windows 11.
          This unsigned executable may trigger a SmartScreen publisher warning.

          WARNING: Notes from the v0.1.0 installed edition are still in its separate
          Windows WebView2/IndexedDB profile. Do not uninstall or erase the old data:
          this portable release does not automatically import that older profile.
          '@ | Set-Content -LiteralPath "$root/README.txt" -Encoding UTF8
          Compress-Archive -Path $root -DestinationPath 'Mini-Notes-Portable-Testing-Windows-x64.zip' -Force

      - name: Upload portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Mini-Notes-Portable-Testing-Windows-x64
          path: Mini-Notes-Portable-Testing-Windows-x64.zip
          if-no-files-found: error
          retention-days: 30

      # Releases are created only after explicit user approval.
      # This workflow uploads a test artifact; it NEVER publishes a GitHub Release.
